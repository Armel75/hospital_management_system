# =============================================================================
# CI — Pipeline Qualité + Build + Test + Push
# -----------------------------------------------------------------------------
# Déclenché sur : push main, pull_request main
#
# Flux garantissant que l'image DÉPLOYÉE est EXACTEMENT celle TESTÉE :
#   1. Lint (Python + XML)
#   2. Build & Push image GHCR (tag SHA immuable)
#   3. Test Odoo avec l'image buildée
#   4. Scan sécurité Trivy (fichiers + image Docker)
#
# Le CD (deploy.yml) est déclenché AUTOMATIQUEMENT après succès de ce workflow.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Job 1 : Qualité ─────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances de lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-odoo

      - name: Linter Python avec flake8
        run: |
          flake8 addons/ \
            --max-line-length=120 \
            --ignore=F841,E501,W503 \
            --show-source \
            --statistics

      - name: Vérifier la syntaxe XML
        run: |
          echo "Vérification des fichiers XML..."
          for xml_file in $(find addons/ -name "*.xml"); do
            python -c "import xml.etree.ElementTree as ET; ET.parse('$xml_file')" 2>/dev/null || \
              echo "❌ Erreur XML dans : $xml_file"
          done
          echo "✅ Tous les XML sont valides."

  # ── Job 2 : Build, Test, Push (flux unique) ─────────────────────────────
  build-test-push:
    name: 🐳 Build → 🧪 Test → 📤 Push GHCR
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push immédiat — Docker layer cache (gha) rend le build rapide.
      # L'image testée ci-dessous est la MÊME que celle déployée par le CD.
      - name: Build & push image Odoo (SHA immuable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/hospital-odoo:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/hospital-odoo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test avec l'image QUI VIENT D'ÊTRE POUSÉE (même SHA que le déploiement)
      - name: Lancer les tests Odoo
        run: |
          docker run --rm \
            --name odoo-test \
            --network host \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            ${{ env.IMAGE_PREFIX }}/hospital-odoo:${{ github.sha }} \
            odoo \
            --test-enable \
            --stop-after-init \
            --db_host=localhost \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d test_hospital \
            -i care_center_base,care_center_consultation,care_center_appointment,care_center_pharmacy,care_center_billing

      # Scan Trivy des fichiers (manifests, Dockerfile, XML…)
      - name: Trivy — scan fichiers
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      # Scan Trivy de l'IMAGE Docker poussée
      - name: Trivy — scan image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}/hospital-odoo:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true
