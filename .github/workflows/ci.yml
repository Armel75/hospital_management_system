# =============================================================================
# CI/CD Pipeline — Centre Hospitalier
# =============================================================================
# Déclenché sur :
#   - push sur main
#   - pull request vers main
#
# Étapes :
#   1. Vérification de la syntaxe Python (flake8)
#   2. Vérification du formatage XML
#   3. Build de l'image Docker
#   4. Tests Odoo
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances de lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-odoo

      - name: Linter Python avec flake8
        run: |
          flake8 addons/ \
            --max-line-length=120 \
            --ignore=F841,E501,W503 \
            --show-source \
            --statistics

      - name: Vérifier la syntaxe XML
        run: |
          echo "Vérification des fichiers XML..."
          # Vérifier que tous les XML sont bien formés
          for xml_file in $(find addons/ -name "*.xml"); do
            python -c "import xml.etree.ElementTree as ET; ET.parse('$xml_file')" 2>/dev/null || \
              echo "❌ Erreur XML dans : $xml_file"
          done
          echo "✅ Tous les XML sont valides."

  build:
    name: 🐳 Build Docker
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Odoo
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: care-center-odoo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: 🧪 Tests Odoo
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Charger l'image buildée
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: care-center-odoo:ci
          load: true

      - name: Lancer les tests Odoo
        run: |
          docker run --rm \
            --name odoo-test \
            --network host \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            care-center-odoo:ci \
            odoo \
            --test-enable \
            --stop-after-init \
            --db_host=localhost \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d test_hospital \
            -i care_center_base,care_center_consultation,care_center_appointment,care_center_pharmacy,care_center_billing
