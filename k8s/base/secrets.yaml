# =============================================================================
# Secrets de l'application Hôpital
# ⚠️  stringData est encodé automatiquement par Kubernetes.
# ⚠️  À ADAPTER avec vos valeurs réelles de production avant `kubectl apply`.
#      En GitOps, utiliser un SealedSecret (voir argocd/sealed-secrets/).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hospital-secrets
  namespace: hospital
type: Opaque
stringData:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Doit correspondre au mot de passe du rôle "odoo".
  POSTGRES_PASSWORD: "Demolisseur.10!@"

  # ── Odoo ──────────────────────────────────────────────────────────────────
  # Mot de passe "master" d'Odoo (création/gestion des bases via l'UI).
  # Peut être en clair (Odoo le hache) ou directement le hash pbkdf2 existant.
  ADMIN_PASSWORD: "Demolisseur@1*"
