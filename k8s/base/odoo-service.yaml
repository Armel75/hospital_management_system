# =============================================================================
# Service Odoo — point d'entrée du trafic (l'Ingress route vers odoo:8069).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: hospital
  labels:
    app: hospital
    tier: odoo
spec:
  selector:
    app: hospital
    tier: odoo
  ports:
    - name: http
      port: 8069
      targetPort: 8069
