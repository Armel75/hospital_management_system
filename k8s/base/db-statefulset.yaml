# =============================================================================
# PostgreSQL 16 — StatefulSet
# - Env : ConfigMap hospital-config + Secret hospital-secrets
# - Volume persistant : volumeClaimTemplates (storageClassName local-path)
# - Le Service "db" (db-service.yaml) expose le port 5432 pour le pod Odoo.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: hospital
  labels:
    app: hospital
    tier: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: hospital
      tier: db
  template:
    metadata:
      labels:
        app: hospital
        tier: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hospital-config
            - secretRef:
                name: hospital-secrets
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "odoo"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "odoo"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
