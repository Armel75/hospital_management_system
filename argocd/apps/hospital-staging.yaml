# =============================================================================
# Application GitOps — STAGING
# Synchronise automatiquement l'overlay kustomize k8s/overlays/staging.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hospital
  source:
    repoURL: https://github.com/Armel75/hospital_management_system.git
    targetRevision: main
    path: k8s/overlays/staging
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
