# =============================================================================
# App-of-apps — racine GitOps
# ArgoCD déploie les Applications définies dans argocd/apps/ (dont les apps
# staging et production qui pointent vers les overlays kustomize).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Armel75/hospital_management_system.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
